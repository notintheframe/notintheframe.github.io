  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1b2f55;overflow:hidden}
  body{font-family:"Poppins",sans-serif;-webkit-tap-highlight-color:transparent}

  /* blurred copy of the poster behind everything (seen on phones) */
  .bg{position:fixed;inset:0;background:linear-gradient(180deg,#2f6fc0 0%,#6fa0d8 22%,#f7b04a 52%,#f08a1c 72%,#5a2106 100%)}
  /* the poster itself */
  .poster{position:fixed;inset:0;background:var(--poster) center/cover no-repeat}

  h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ---------- glass buttons ---------- */
  .glass{
    background:rgba(255,255,255,.10);
    -webkit-backdrop-filter:blur(6px) saturate(1.4);backdrop-filter:blur(6px) saturate(1.4);
    border:1px solid rgba(255,255,255,.45);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 18px rgba(0,0,0,.18);
    color:rgba(255,255,255,.80);                 /* letters let the picture peek through */
    text-shadow:0 1px 3px rgba(0,0,0,.35);
    border-radius:999px;cursor:default;user-select:none;
    transition:background .25s, color .25s, border-color .25s;
  }
  .glass:hover{background:rgba(255,255,255,.20);color:rgba(255,255,255,.95);border-color:rgba(255,255,255,.7)}

  nav{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:center;gap:clamp(8px,2.2vw,34px);
      padding:max(14px,env(safe-area-inset-top)) 12px 0}
  nav span{font-weight:600;font-size:clamp(.78rem,1.35vw,1.12rem);padding:.42em 1.4em}

  .tags{position:fixed;bottom:0;left:0;right:0;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;
        gap:clamp(6px,1.2vw,16px);padding:0 12px max(14px,env(safe-area-inset-bottom))}
  .tags span{font-style:italic;font-weight:500;font-size:clamp(.74rem,1.15vw,1.02rem);padding:.36em 1.15em}
  .tags span.by{font-weight:600}

  /* ---------- phones / tall screens: poster fits whole, blurred poster fills the rest ---------- */
  @media (max-aspect-ratio:13/10){
    .poster{inset:auto 0;top:50%;transform:translateY(-50%);
            aspect-ratio:900/912;
            -webkit-mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent);background-size:cover;background-position:center}
    nav{flex-wrap:wrap;gap:8px;padding-top:max(22px,env(safe-area-inset-top))}
    nav span{font-size:.86rem;padding:.4em 1.05em}
    .tags{gap:8px;padding-bottom:max(26px,env(safe-area-inset-bottom))}
    .tags span{font-size:.82rem}
    .tags span.by{flex-basis:auto}
  }
</style>
